<div class="dialog-container">
    <h2 mat-dialog-title>{{ data.title }}</h2>
    <div mat-dialog-content>
      <p>{{ data.message }}</p>
    </div>
    <div mat-dialog-actions align="end">
      <button mat-raised-button  [mat-dialog-close]="true">
        <mat-icon>{{ data.icon }}</mat-icon>
        {{ data.buttonText }}
      </button>
    </div>
  </div>
