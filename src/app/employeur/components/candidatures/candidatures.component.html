<div class="candidatures-container">
    <h2>Gérer les Candidatures</h2>
  
    <!-- Tableau des candidatures -->
    <table mat-table [dataSource]="candidatures" class="mat-elevation-z8">
      <!-- Colonne Nom -->
      <ng-container matColumnDef="nom">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let candidature">{{ candidature.nom }}</td>
      </ng-container>
  
      <!-- Colonne Prénom -->
      <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef>Prénom</th>
        <td mat-cell *matCellDef="let candidature">{{ candidature.prenom }}</td>
      </ng-container>
  
      <!-- Colonne Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let candidature">{{ candidature.email }}</td>
      </ng-container>
  
      <!-- Colonne Statut -->
      <ng-container matColumnDef="statut">
        <th mat-header-cell *matHeaderCellDef>Statut</th>
        <td mat-cell *matCellDef="let candidature">{{ candidature.statut }}</td>
      </ng-container>
  
      <!-- Colonne Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let candidature">
          <button mat-icon-button color="primary" (click)="validerCandidature(candidature)">
            <mat-icon>check</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="rejeterCandidature(candidature)">
            <mat-icon>close</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- En-têtes et lignes du tableau -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
