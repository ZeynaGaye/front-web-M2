<div class="modal-overlay" (click)="closeModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <span class="close" (click)="closeModal()">&times;</span>
      <h2>Postuler à cette offre</h2>
      <p>Démontrez vos compétences et votre expérience dans le domaine de la beauté.</p>
  
      <!-- Indicateurs d'étapes -->
      <div class="step-indicators">
        <div class="step" [class.active]="currentStep >= 1"></div>
        <div class="step" [class.active]="currentStep >= 2"></div>
      </div>
  
      <!-- Formulaire -->
      <form [formGroup]="candidatureForm" (ngSubmit)="onSubmit()">
        <!-- Étape 1 : Expérience et spécialités -->
        <div class="step-content" *ngIf="currentStep === 1">
          <div class="form-group">
            <label>Spécialités en beauté</label>
            <textarea formControlName="specialites" placeholder="Ex: Maquillage professionnel, pose d'ongles, extensions de cils..."></textarea>
            <small *ngIf="candidatureForm.get('specialites')?.invalid && candidatureForm.get('specialites')?.touched">
              Veuillez préciser vos spécialités
            </small>
          </div>
  
          <div class="form-group">
            <label>Expérience professionnelle</label>
            <textarea formControlName="experience" placeholder="Décrivez votre expérience professionnelle dans le domaine"></textarea>
            <small *ngIf="candidatureForm.get('experience')?.invalid && candidatureForm.get('experience')?.touched">
              L'expérience est obligatoire
            </small>
          </div>
  
          <div class="form-group">
            <label>Disponibilité</label>
            <select formControlName="disponibilite">
              <option value="">Sélectionnez votre disponibilité</option>
              <option value="Immédiate">Immédiate</option>
              <option value="Janvier">Janvier</option>
              <option value="Février">Février</option>
              <option value="Mars">Mars</option>
              <option value="Avril">Avril</option>
              <option value="Mai">Mai</option>
              <option value="Juin">Juin</option>
              <option value="Juillet">Juillet</option>
              <option value="Août">Août</option>
              <option value="Septembre">Septembre</option>
              <option value="Octobre">Octobre</option>
              <option value="Novembre">Novembre</option>
              <option value="Décembre">Décembre</option>
            </select>
            <small *ngIf="candidatureForm.get('disponibilite')?.invalid && candidatureForm.get('disponibilite')?.touched">
              La disponibilité est obligatoire
            </small>
          </div>
  
          <div class="form-group">
            <label>Tarif horaire souhaité (FCFA)</label>
            <input type="text" formControlName="pretentionSalariale" placeholder="Ex: 5000 FCFA/heure" />
          </div>
  
          <button type="button" class="btn-primary" (click)="nextStep()">
            Suivant
          </button>
        </div>
  
        <!-- Étape 2 : Portfolio et documents -->
        <div class="step-content" *ngIf="currentStep === 2">
          <!-- <div class="form-group">
            <label>Photos de portfolio (max 5)</label>
            <input type="file" accept="image/*" multiple (change)="onPortfolioChange($event)" [disabled]="portfolioFiles.length >= 5" />
            <small class="info-text">Partagez vos meilleures réalisations (maquillage, coiffure, soins...)</small>
          </div> -->
  
          <!-- <div class="portfolio-preview" *ngIf="portfolioFiles.length > 0">
            <h4>Vos photos sélectionnées:</h4>
            <div class="portfolio-images">
              <div class="portfolio-image" *ngFor="let file of portfolioFiles; let i = index">
                <span class="remove-image" (click)="removePortfolioImage(i)">&times;</span>
                <img [src]="file ? URL.createObjectURL(file) : ''" alt="Preview" /> -->
              <!-- </div>
            </div>
          </div> -->
  
          <div class="form-group">
            <label>CV (optionnel)</label>
            <input type="file" accept=".pdf,.doc,.docx" (change)="onCvChange($event)" />
          </div>
  
          <div class="form-group">
            <label>Message complémentaire</label>
            <textarea formControlName="message" placeholder="Message additionnel pour l'employeur"></textarea>
          </div>
  
          <div class="button-group">
            <button type="button" class="btn-secondary" (click)="previousStep()">
              Retour
            </button>
            <button type="submit" class="btn-primary" [disabled]="candidatureForm.invalid">
              Soumettre ma candidature
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>
