<div class="accueil-container">
       <app-header></app-header>
    <!-- SECTION RECOMMANDATIONS -->
  <section class="recommendations-wrapper" *ngIf="showRecommendations">
    <app-recommendations
      ngSkipHydration
      [showRecommendations]="true"
      [autoLoad]="true"
      [userLocation]="userLocation"
      [headerTitle]="'Découvrez les meilleurs professionnels'"
      [headerSubtitle]="'Sélectionnés spécialement pour vous selon vos préférences'"
      (salonClick)="onSalonClick($event)"
      (viewAllSection)="onViewAllSection($event)"
      (favoriteToggle)="onFavoriteToggle($event)">
    </app-recommendations>
  </section>
  <!-- <app-header></app-header> -->
  <section id="pro-section"><app-pro-free></app-pro-free></section>
  <!-- <app-client-section></app-client-section> -->
  

  

  <!-- SECTION OPPORTUNITÉS D'EMPLOI -->
  <section id="offres-section" class="job-opportunities-wrapper" *ngIf="showJobOpportunities">
    <app-opportunites-emploi
      [maxOffersToShow]="maxJobOffersOnHomepage"
      [showHeader]="true"
      [compactMode]="true"
      [autoLoad]="true"
      (offreClick)="onJobOfferClick($event)"
      (viewAllClick)="onViewAllJobOffers()"
      (filterChange)="onJobFilterChange($event)">
    </app-opportunites-emploi>
  </section>

  <!-- SECTION RECRUTEMENT EMPLOYEURS -->
  <section id="hiring-section"><app-job-offer></app-job-offer></section>
  
</div>
