<div class="accueil-container">
  <app-header></app-header>
    <!-- SECTION RECOMMANDATIONS -->
  <section class="recommendations-wrapper" *ngIf="showRecommendations">
    <app-recommendations
      [showRecommendations]="true"
      [autoLoad]="true"
      [userLocation]="userLocation"
      [headerTitle]="'Découvrez les meilleurs professionnels'"
      [headerSubtitle]="'Sélectionnés spécialement pour vous selon vos préférences'"
      [showCta]="true"
      [ctaTitle]="'Besoin de plus d\'options ?'"
      [ctaDescription]="'Explorez notre catalogue complet ou utilisez notre recherche avancée'"
      [ctaButtonText]="'Explorer tous les salons'"
      (salonClick)="onSalonClick($event)"
      (viewAllSection)="onViewAllSection($event)"
      (favoriteToggle)="onFavoriteToggle($event)"
      (ctaClick)="onRecommendationCta()">
    </app-recommendations>
  </section>
  <!-- <app-header></app-header> -->
  <app-pro-free></app-pro-free>
  <app-client-section></app-client-section>
