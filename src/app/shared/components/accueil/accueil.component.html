<div class="accueil-container">
  <app-header></app-header>

  <!-- SECTION RECOMMANDATIONS -->
  <section class="recommendations-wrapper reveal-section" *ngIf="showRecommendations">
    <app-recommendations
      ngSkipHydration
      [showRecommendations]="true"
      [autoLoad]="true"
      [userLocation]="userLocation"
      [headerTitle]="'Découvrez les meilleurs professionnels'"
      [headerSubtitle]="'Salons et freelances beauté soigneusement sélectionnés près de chez vous'"
      (salonClick)="onSalonClick($event)"
      (viewAllSection)="onViewAllSection($event)"
      (favoriteToggle)="onFavoriteToggle($event)">
    </app-recommendations>
  </section>

  <section id="pro-section" class="reveal-section"><app-pro-free></app-pro-free></section>
  <section id="salon-section" class="reveal-section"><app-salon-registration></app-salon-registration></section>

  <!-- SECTION OPPORTUNITÉS D'EMPLOI -->
  <section id="offres-section" class="job-opportunities-wrapper reveal-section" *ngIf="showJobOpportunities">
    <app-opportunites-emploi
      [maxOffersToShow]="maxJobOffersOnHomepage"
      [showHeader]="true"
      [compactMode]="true"
      [autoLoad]="true"
      (offreClick)="onJobOfferClick($event)"
      (viewAllClick)="onViewAllJobOffers()"
      (filterChange)="onJobFilterChange($event)">
    </app-opportunites-emploi>
  </section>

  <!-- SECTION RECRUTEMENT EMPLOYEURS -->
  <section id="hiring-section" class="reveal-section"><app-job-offer></app-job-offer></section>

</div>
