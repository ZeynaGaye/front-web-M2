<div class="contact-container">
  <button class="close-button" (click)="closeModal()">&times;</button>
  <h1>Contactez-nous</h1>
  <p>Nous serions ravis de répondre à vos questions. Remplissez le formulaire ci-dessous pour nous contacter.</p>

  <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">
    <!-- Champ Nom -->
    <div class="form-group">
      <label for="name">Nom</label>
      <input
        id="name"
        type="text"
        formControlName="name"
        placeholder="Votre nom"
        required
      />
      <div *ngIf="contactForm.get('name')?.invalid && contactForm.get('name')?.touched" class="error-message">
        Le nom est requis.
      </div>
    </div>

    <!-- Champ E-mail -->
    <div class="form-group">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="Votre e-mail"
        required
      />
      <div *ngIf="contactForm.get('email')?.invalid && contactForm.get('email')?.touched" class="error-message">
        Veuillez entrer une adresse e-mail valide.
      </div>
    </div>

    <!-- Champ Sujet -->
    <div class="form-group">
      <label for="subject">Sujet</label>
      <input
        id="subject"
        type="text"
        formControlName="subject"
        placeholder="Sujet de votre message"
        required
      />
      <div *ngIf="contactForm.get('subject')?.invalid && contactForm.get('subject')?.touched" class="error-message">
        Le sujet est requis.
      </div>
    </div>

    <!-- Champ Message -->
    <div class="form-group">
      <label for="message">Message</label>
      <textarea
        id="message"
        formControlName="message"
        placeholder="Votre message"
        rows="5"
        required
      ></textarea>
      <div *ngIf="contactForm.get('message')?.invalid && contactForm.get('message')?.touched" class="error-message">
        Le message est requis.
      </div>
    </div>

    <!-- Bouton de soumission -->
    <button type="submit" [disabled]="contactForm.invalid">Envoyer</button>
  </form>
</div>
